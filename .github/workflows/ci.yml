name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      EXPECTED_ARCH: ${{ matrix.arch }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native toolchain
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          xcodebuild -version
          swift --version

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          info = plistlib.loads(Path('Resources/Info.plist').read_bytes())
          if os.environ['RELEASE_TAG'] != 'v' + info['CFBundleShortVersionString']:
              raise SystemExit('Release tag must exactly match the version in Resources/Info.plist')
          PY

      - name: Use temporary signing for CI builds
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: printf 'CODE_SIGN_IDENTITY=-\n' >> "$GITHUB_ENV"

      - name: Import dedicated release signing identity
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: python3 scripts/ci-signing.py install

      - name: Run full checks
        run: ./scripts/check.sh --full

      - name: Build and package native application
        run: ./scripts/package.sh

      - name: Upload application and verification files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: menu-tidy-macos-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.zip.metadata.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove temporary release signing material
        if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
        run: python3 scripts/ci-signing.py cleanup

  release:
    name: Publish verified prerelease
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download both native packages from this workflow
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: menu-tidy-macos-*
          merge-multiple: true
          path: artifacts
          digest-mismatch: error

      - name: Verify complete release payload and provenance
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import plistlib
          import re
          from pathlib import Path

          info = plistlib.loads(Path('Resources/Info.plist').read_bytes())
          version = info['CFBundleShortVersionString']
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', version):
              raise SystemExit('Invalid application version')
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Tag and application version differ')
          directory = Path('artifacts')
          expected = set()
          requirements = []
          for arch in ('arm64', 'x86_64'):
              name = f'Menu-Tidy-{version}-macos-{arch}.zip'
              expected.update((name, name + '.sha256', name + '.metadata.json'))
              archive = directory / name
              checksum = (directory / (name + '.sha256')).read_text().strip().split(maxsplit=1)
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              if checksum != [digest, name]:
                  raise SystemExit(f'Archive checksum or checksum filename mismatch: {name}')
              metadata = json.loads((directory / (name + '.metadata.json')).read_text())
              required = {
                  'version': version,
                  'build': info['CFBundleVersion'],
                  'architecture': arch,
                  'minimumMacOS': info['LSMinimumSystemVersion'],
                  'bundleIdentifier': info['CFBundleIdentifier'],
                  'commit': os.environ['RELEASE_COMMIT'],
                  'archive': name,
                  'sha256': digest,
              }
              if any(metadata.get(key) != value for key, value in required.items()):
                  raise SystemExit(f'Package metadata does not match this release: {name}')
              if metadata.get('dirty') is not False:
                  raise SystemExit(f'Package was not built from a clean checkout: {name}')
              requirement = metadata.get('designatedRequirement', '')
              if not re.search(r'certificate leaf = H"[0-9A-Fa-f]{40}"', requirement):
                  raise SystemExit(f'Package lacks a certificate-pinned signing identity: {name}')
              requirements.append(requirement)
          if requirements[0] != requirements[1]:
              raise SystemExit('The two architectures do not have the same signing requirement')
          if {path.name for path in directory.iterdir()} != expected:
              raise SystemExit('Release payload contains missing or unexpected files')
          print(f'Verified both architectures for {version} at {os.environ["RELEASE_COMMIT"]}')
          PY
          (cd artifacts && sha256sum --check ./*.zip.sha256)
          python3 scripts/release-notes.py "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Create complete draft, then publish as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
            echo "A release for $RELEASE_TAG already exists; refusing to replace it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" artifacts/* \
            --verify-tag --draft --prerelease --latest=false \
            --title "Menu Tidy $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets \
            > "$RUNNER_TEMP/release-draft.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-draft.json').read_text())
          expected = {path.name: path.stat().st_size for path in Path('artifacts').iterdir()}
          assets = {asset['name']: asset['size'] for asset in release['assets']}
          if (release['tagName'] != os.environ['RELEASE_TAG']
                  or release['isDraft'] is not True or release['isPrerelease'] is not True
                  or assets != expected or len(release['assets']) != len(expected)):
              raise SystemExit('Draft release is incomplete; refusing to publish')
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
