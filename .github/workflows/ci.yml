name: Build and release

on:
  push:
    branches: ['**', '!updates']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      validate_signing:
        description: 'Validate dedicated signing on both architectures without publishing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.validate_signing || false }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      EXPECTED_ARCH: ${{ matrix.arch }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native toolchain
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          xcodebuild -version
          swift --version

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          info = plistlib.loads(Path('Resources/Info.plist').read_bytes())
          if os.environ['RELEASE_TAG'] != 'v' + info['CFBundleShortVersionString']:
              raise SystemExit('Release tag must exactly match the version in Resources/Info.plist')
          PY

      - name: Use temporary signing for CI builds
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.validate_signing) }}
        run: printf 'CODE_SIGN_IDENTITY=-\n' >> "$GITHUB_ENV"

      - name: Import dedicated release signing identity
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.validate_signing)
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: python3 scripts/ci-signing.py install

      - name: Run full checks
        run: ./scripts/check.sh --full

      - name: Build and package native application
        run: ./scripts/package.sh

      - name: Fetch pinned Sparkle publishing tools
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.validate_signing)
        run: python3 scripts/fetch-sparkle-tools.py --output "$RUNNER_TEMP/sparkle-tools"

      - name: Sign and independently verify the update archive
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.validate_signing)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          # Manual signing validation uses the app's version, never the branch name.
          UPDATE_TAG="$(python3 -c 'import plistlib; print("v" + plistlib.load(open("Resources/Info.plist", "rb"))["CFBundleShortVersionString"])')"
          python3 scripts/generate-update-feed.py sign \
            --artifacts dist --arch "$EXPECTED_ARCH" --tag "$UPDATE_TAG" \
            --commit "$RELEASE_COMMIT" --sign-tool "$RUNNER_TEMP/sparkle-tools/bin/sign_update"

      - name: Upload application and verification files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: menu-tidy-macos-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.zip.metadata.json
            dist/*.zip.eddsa.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove temporary release signing material
        if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.validate_signing)) }}
        run: python3 scripts/ci-signing.py cleanup

  release:
    name: Publish signed release and update feeds
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 15
    # Different tags must not concurrently read and overwrite the updates branch.
    concurrency:
      group: menu-tidy-publish-updates
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      FEED_DIRECTORY: ${{ runner.temp }}/menu-tidy-updates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download both native packages from this workflow
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: menu-tidy-macos-*
          merge-multiple: true
          path: artifacts
          digest-mismatch: error

      - name: Fetch pinned Sparkle publishing tools
        run: python3 scripts/fetch-sparkle-tools.py --output "$RUNNER_TEMP/sparkle-tools"

      - name: Read the latest published update channels
        run: |
          gh auth setup-git
          git init "$FEED_DIRECTORY"
          git -C "$FEED_DIRECTORY" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          # Status 2 specifically means the branch does not exist. Network or auth
          # failures must not be mistaken for the first release.
          set +e
          git -C "$FEED_DIRECTORY" ls-remote --exit-code origin refs/heads/updates > "$RUNNER_TEMP/feed-ref"
          ref_status=$?
          set -e
          if [ "$ref_status" -eq 0 ]; then
            git -C "$FEED_DIRECTORY" fetch --depth=1 origin refs/heads/updates
            git -C "$FEED_DIRECTORY" checkout -b updates FETCH_HEAD
          elif [ "$ref_status" -eq 2 ]; then
            git -C "$FEED_DIRECTORY" checkout --orphan updates
          else
            echo 'Cannot read the updates branch; refusing publication.' >&2
            exit 1
          fi

      - name: Verify payload and prepare signed feeds without publishing
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 scripts/release-notes.py "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          python3 scripts/generate-update-feed.py generate \
            --artifacts artifacts --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" \
            --sign-tool "$RUNNER_TEMP/sparkle-tools/bin/sign_update" \
            --feeds "$FEED_DIRECTORY" --notes "$RUNNER_TEMP/release-notes.md"
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          version = plistlib.loads(Path('Resources/Info.plist').read_bytes())['CFBundleShortVersionString']
          channel = 'preview' if '-' in version else 'stable'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('UPDATE_CHANNEL=' + channel + '\n')
          PY

      - name: Create complete draft, then publish the appropriate release channel
        run: |
          if gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
            echo "A release for $RELEASE_TAG already exists; refusing to replace it." >&2
            exit 1
          fi
          if [ "$UPDATE_CHANNEL" = preview ]; then
            release_flags=(--prerelease --latest=false)
          else
            release_flags=(--latest)
          fi
          gh release create "$RELEASE_TAG" artifacts/* \
            --verify-tag --draft "${release_flags[@]}" \
            --title "Menu Tidy $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets \
            > "$RUNNER_TEMP/release-draft.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-draft.json').read_text())
          expected = {path.name: path.stat().st_size for path in Path('artifacts').iterdir()}
          assets = {asset['name']: asset['size'] for asset in release['assets']}
          if (release['tagName'] != os.environ['RELEASE_TAG']
                  or release['isDraft'] is not True
                  or release['isPrerelease'] != (os.environ['UPDATE_CHANNEL'] == 'preview')
                  or assets != expected or len(release['assets']) != len(expected)):
              raise SystemExit('Draft release is incomplete; refusing to publish')
          PY
          gh release edit "$RELEASE_TAG" --draft=false "${release_flags[@]}"

      - name: Advance feeds only after release assets are public
        run: |
          git -C "$FEED_DIRECTORY" config user.name 'github-actions[bot]'
          git -C "$FEED_DIRECTORY" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$FEED_DIRECTORY" add -- "$UPDATE_CHANNEL/appcast-arm64.xml" "$UPDATE_CHANNEL/appcast-x86_64.xml"
          git -C "$FEED_DIRECTORY" commit -m "chore(updates): publish $RELEASE_TAG"
          # No force push: an unexpected external writer causes a safe failure.
          git -C "$FEED_DIRECTORY" push origin HEAD:refs/heads/updates
